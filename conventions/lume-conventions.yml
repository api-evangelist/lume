pagination:
  style: paginated-response
  response_envelope: PaginatedResponse
  notes: >-
    List endpoints return a PaginatedResponse<T> envelope in the TypeScript SDK (types/pagination).
    Callers page through jobs/results rather than receiving unbounded arrays.
webhooks:
  supported: true
  purpose: Delivery of run/workbook completion results to consumer endpoints.
  ref: asyncapi/lume-webhooks.yml
  docs: https://docs.lume.ai/pages/libraries/python-ent/examples/webhook-driven-app.md
async_execution:
  model: >-
    Data transformations run asynchronously. A Flow/Pipeline run is triggered, then its status is
    polled (Understanding Runs / Understanding Workbooks) or a webhook fires on completion, after
    which results are fetched from the Results service.
