aid: lume
name: Lume
description: >-
  Lume is an AI-powered customer data integration platform for software teams. Its models handle
  schema discovery, suggest intelligent field-level data mappings, validate data quality, and
  generate transformation code automatically, turning a manual data-onboarding process into a fast,
  repeatable pipeline. Teams create Flows and Projects that map arbitrary source data (CSV/S3,
  relational databases such as PostgreSQL or Snowflake, and API payloads) to their own internal
  target schemas. Lume exposes a REST API and first-party Python and TypeScript SDKs, delivers run
  results via webhooks, and is SOC 2 Type 1 and Type 2 compliant. Backed by General Catalyst, Khosla
  Ventures, Floodgate, Soma Capital, and Y Combinator; in March 2026 Lume joined Harvey AI.
